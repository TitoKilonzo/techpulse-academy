<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-gradient)" />
  
  <!-- Outer Glow / Ring (Optional, subtle) -->
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="#FFF" stroke-opacity="0.1" stroke-width="16" />

  <!-- Lightning Bolt (Zap) Icon -->
  <path d="M288 32 L112 304 L256 304 L224 480 L400 208 L256 208 L288 32 Z" fill="#FFF" />
  
  <!-- Definitions -->
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B" /> <!-- Golden/Amber -->
      <stop offset="1" stop-color="#E8860C" /> <!-- Deep Orange -->
    </linearGradient>
  </defs>
</svg>
